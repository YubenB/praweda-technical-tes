services:
  db:
    image: postgres:17-alpine
    container_name: soal3-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soal3_sql
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # create 2nd db buat the orm part
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soal3_sql"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
